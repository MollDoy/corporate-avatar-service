services:
  api:
    build: .
    container_name: avatar_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app/storage:/app/storage
      - ./models/rembg:/app/models/rembg
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: avatar_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - avatar_pg_data:/var/lib/postgresql/data

volumes:
  avatar_pg_data: