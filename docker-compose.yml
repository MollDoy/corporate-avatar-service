services:
  db:
    image: postgres:16
    container_name: avatar_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - avatar_pg_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:7.4-alpine
    container_name: avatar_redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec"
      ]

    volumes:
      - avatar_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  models-init:
    build:
      context: .
      dockerfile: Dockerfile.models

    image: corporate-avatar-models-init:latest
    container_name: avatar_models_init

    env_file:
      - .env

    environment:
      MODELS_ROOT: /models
      INSIGHTFACE_ROOT: /models/insightface

      AI_BASE_MODEL_DIR: /models/base_model
      AI_VAE_MODEL_DIR: /models/vae
      AI_CLIP_MODEL_DIR: /models/clip_vision
      CONSISTENTID_MODEL_DIR: /models/consistentid
      AI_CONTROLNET_MODEL_DIR: /models/controlnet_openpose
      REMBG_MODEL_DIR: /models/rembg

      ANTELOPEV2_URL: >-
        https://github.com/deepinsight/insightface/releases/download/v0.7/antelopev2.zip

      BUFFALO_L_URL: >-
        https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip

    volumes:
      - ./models:/models

    restart: "no"

    profiles:
      - ai


  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    image: corporate-avatar-service-api:latest
    container_name: avatar_migrate

    env_file:
      - .env

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]

    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro

    depends_on:
      db:
        condition: service_healthy

    restart: "no"


  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: corporate-avatar-service-api:latest
    container_name: avatar_api

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./app/storage:/app/storage

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  worker:
    build:
      context: .
      dockerfile: Dockerfile.ai

    image: corporate-avatar-service-ai-worker:latest
    container_name: avatar_worker

    env_file:
      - .env

    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=avatar_jobs",
        "--pool=prefork",
        "--concurrency=1",
        "--prefetch-multiplier=1",
        "--max-tasks-per-child=1"
      ]

    environment:
      STORAGE_DIR: /app/storage
      STORAGE_ROOT: /app/storage/jobs

      MODELS_ROOT: /models
      INSIGHTFACE_ROOT: /models/insightface

      AI_BASE_MODEL_DIR: /models/base_model
      AI_VAE_MODEL_DIR: /models/vae
      AI_CLIP_MODEL_DIR: /models/clip_vision
      CONSISTENTID_MODEL_DIR: /models/consistentid
      AI_CONTROLNET_MODEL_DIR: /models/controlnet_openpose
      REMBG_MODEL_DIR: /models/rembg
      U2NET_HOME: /models/rembg

      AI_BATCH_SCRIPT_PATH: /app/scripts/ai_service.py
      BACKGROUND_MATTING_SCRIPT_PATH: >-
        /app/scripts/background_matting.py

      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DIFFUSERS_OFFLINE: "1"

      OMP_NUM_THREADS: ${BACKGROUND_MATTING_THREADS}
      MALLOC_TRIM_THRESHOLD_: "65536"

      PYTORCH_CUDA_ALLOC_CONF: >-
        expandable_segments:True

      CUDA_MODULE_LOADING: "LAZY"

    volumes:
      - type: bind
        source: ./app/storage
        target: /app/storage
        read_only: false

      - type: bind
        source: ./models
        target: /models
        read_only: false

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

      models-init:
        condition: service_completed_successfully

    gpus: all
    shm_size: "1gb"

    mem_limit: 14g
    memswap_limit: 18g
    cpus: 8.0

    restart: unless-stopped
    stop_grace_period: 60s

    profiles:
      - ai


volumes:
  avatar_pg_data:
  avatar_redis_data: